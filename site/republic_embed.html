Вес межрайонной связи — exp(−время/τ). Для каждого места назначения суммируется население 45 МО с такими весами, затем работники организаций этого назначения распределяются между потенциальными жителями. Доступность — сумма этих долей на одного жителя. Среднее время двух направлений используется в модели конкуренции, максимальное — для проверки порога доступности в обоих направлениях. Внутрирайонное время условно равно 10 минутам.|||Intermunicipal weights are exp(−time/τ). At each destination, the population of all 45 municipalities is summed using these weights; the destination’s organisation employees are then allocated among potential residents. Access sums these shares per resident. The competition model uses mean two-way travel time; the two-way threshold uses the maximum. Intramunicipal time is assumed to be 10 minutes.

function installRepublicLocale(){
  const area=$('app'), parent=document.querySelector('#dgl-tw');
  const originals=new WeakMap(), attributes=new WeakMap();
  const names=D.profiles.flatMap(p=>[[p.name,p.name_en||p.name],[p.short,p.short_en||p.name_en||p.short]]);
  const dictionary=[...REPUBLIC_TRANSLATIONS,...names].sort((a,b)=>b[0].length-a[0].length);
  // One replacement pass prevents short labels from rewriting longer translated messages.
  const lookup=new Map(dictionary), pattern=new RegExp(dictionary.map(([ru])=>ru.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
  const translate=text=>text.replace(pattern,ru=>lookup.get(ru)).replace(/\sиз\s/g,' of ');
  const excluded=el=>el?.closest('script,style,[data-source-text]');
  function paint(){
    observer.disconnect();
    const walk=area.ownerDocument.createTreeWalker(area,4);
    for(let node;node=walk.nextNode();){
      if(excluded(node.parentElement))continue;
      let record=originals.get(node);
      if(!record||node.data!==record.rendered)record={ru:node.data};
      record.rendered=republicLang==='en'?translate(record.ru):record.ru;
      if(node.data!==record.rendered)node.data=record.rendered;
      originals.set(node,record);
    }
    area.querySelectorAll('[aria-label],[placeholder],[title]').forEach(el=>{
      if(excluded(el))return;
      let records=attributes.get(el)||{};
      for(const attr of ['aria-label','placeholder','title']){
        if(!el.hasAttribute(attr))continue;
        let record=records[attr];const value=el.getAttribute(attr);
        if(!record||value!==record.rendered)record={ru:value};
        record.rendered=republicLang==='en'?translate(record.ru):record.ru;
        if(value!==record.rendered)el.setAttribute(attr,record.rendered);
        records[attr]=record;
      }attributes.set(el,records);
    });
    area.lang=republicLang;
    area.querySelectorAll('[data-republic-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.republicLang===republicLang)));
    observer.observe(area,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['aria-label','placeholder','title']});
  }
  const observer=new MutationObserver(paint);
  function setLanguage(value){
    republicLang=value==='en'?'en':'ru';
    // Re-render numeric formats and source-record salaries while preserving all model controls.
    renderScenario();drawMap();renderProfile();renderTable();renderJobs();
    if(!parent){document.documentElement.lang=republicLang;document.title=L('Татарстан · Двойник всех муниципалитетов','Tatarstan · Twin of all municipalities');}
    paint();
  }
  area.querySelectorAll('[data-republic-lang]').forEach(b=>b.addEventListener('click',()=>setLanguage(b.dataset.republicLang)));
  if(parent)new MutationObserver(()=>setLanguage(parent.dataset.lang)).observe(parent,{attributes:true,attributeFilter:['data-lang']});
  setLanguage(parent?.dataset.lang||new URLSearchParams(location.search).get('lang')||'ru');
}

 id=\"show-labels\"> Все подписи</label><button type=\"button\" id=\"focus-map\">Приблизить выбранный район</button></div><div class=\"map-tabs\" id=\"map-tabs\"></div><p id=\"map-subtitle\" class=\"map-subtitle\"></p><div class=\"map-wrap\"><svg id=\"map\" role=\"img\" aria-label=\"45 муниципалитетов Татарстана\"></svg></div><div class=\"map-legend\"><div class=\"legend-scale\"><span id=\"legend-min\"></span><span class=\"gradient\"></span><span id=\"legend-max\"></span></div><span id=\"legend-unit\" class=\"meta\"></span></div><p class=\"map-foot\" id=\"map-foot\">© участники OpenStreetMap · ODbL. Районы и городские округа показаны раздельно. Для маленького контура используйте список справа.</p><div class=\"controls\"><div><label class=\"control-label\" for=\"threshold\"><span id=\"threshold-name\">Порог доступности</span> <output id=\"threshold-out\">60 мин</output></label><input id=\"threshold\" type=\"range\" min=\"30\" max=\"120\" step=\"5\" value=\"60\"><p class=\"control-help\" id=\"threshold-help\">В обоих направлениях на машине между центрами МО.</p></div><div><label class=\"control-label\" for=\"penalty\">Условная задержка <output id=\"penalty-out\">0 мин</output></label><input id=\"penalty\" type=\"range\" min=\"0\" max=\"30\" step=\"5\" value=\"0\"><p class=\"control-help\">Добавка к межрайонной поездке, без изменения внутреннего времени.</p></div></div></div>\n<aside class=\"panel\"><div class=\"profile-top\"><span class=\"meta\">Выберите муниципалитет</span><select id=\"center\" aria-label=\"Муниципалитет Татарстана\"></select><h2 id=\"profile-title\" class=\"profile-title\"></h2></div><div id=\"profile\" class=\"profile-body\"></div></aside></section>\n<section class=\"below\"><div class=\"panel\"><div class=\"panel-head\"><h2>Размещение новых рабочих мест</h2><span class=\"type-label model\">Сценарий · 45 МО</span></div><div class=\"section-body\"><p class=\"scenario-intro\">Сравните размещение 1 000 условных мест. Влияние оценивается для всех жителей республики; стоимость создания мест в модель не входит.</p><div class=\"scenario-actions\" id=\"presets\"><button data-preset=\"one\" aria-pressed=\"true\">В выбранный район</button><button data-preset=\"population\" aria-pressed=\"false\">По численности жителей</button><button data-preset=\"equalize\" aria-pressed=\"false\">Выравнивать доступность</button></div><label class=\"allocation-editor\" for=\"selected-jobs\"><span>Новых мест: <strong id=\"allocation-name\"></strong></span><input id=\"selected-jobs\" type=\"number\" min=\"0\" max=\"100000\" step=\"100\" value=\"1000\"></label><p class=\"control-help\">Можно последовательно выбрать несколько районов и задать число мест в каждом.</p><div class=\"scenario-result\"><div><strong id=\"gain-mean\"></strong><span>средний прирост по 45 МО</span></div><div><strong id=\"gain-min\"></strong><span>наименьший прирост по 45 МО</span></div></div><p class=\"table-note\" id=\"scenario-note\"></p><details class=\"allocation-details\"><summary>Распределение мест и эффект по всем районам</summary><div class=\"table-scroll\"><table><thead><tr><th>Муниципалитет</th><th>Новых мест</th><th>Прирост</th></tr></thead><tbody id=\"allocations\"></tbody></table></div></details><div style=\"margin-top:17px\"><label class=\"control-label\" for=\"tau\">Чувствительность к времени <output id=\"tau-out\">45 мин</output></label><input id=\"tau\" type=\"range\" min=\"20\" max=\"60\" value=\"45\" step=\"5\"><p class=\"control-help\">Меньший параметр сильнее уменьшает вес далёких мест.</p></div></div></div>\n<div class=\"panel\"><div class=\"panel-head\"><h2>Связи выбранной территории</h2><span class=\"type-label model\">Модель</span></div><div class=\"section-body\"><p class=\"scenario-intro\" id=\"route-intro\"></p><div id=\"routes\"></div><div class=\"notice\" style=\"margin-top:15px\">Это потенциальная доступность. Число работников взвешивается временем в пути; фактические поездки жителей не наблюдаются. Автобусные расписания, квалификация и занятость малого бизнеса в этот расчёт не входят.</div></div></div></section>\n<section class=\"section\"><h2>Сравнение всех муниципалитетов</h2><p class=\"section-intro\">Район включает город и сельские поселения. Казань и Набережные Челны — отдельные городские округа. Нажмите на название столбца для сортировки.</p><div class=\"table-tools\"><input id=\"table-search\" type=\"search\" class=\"job-search\" placeholder=\"Найти район или городской округ\" aria-label=\"Поиск муниципалитетов\"><span id=\"table-count\" class=\"meta\"></span></div><div class=\"table-scroll compare-scroll\"><table><thead><tr><th><button data-sort=\"name\">Муниципалитет</button></th><th><button data-sort=\"population\">Жителей<br>01.01.2024</button></th><th><button data-sort=\"employees\">Работников без малого бизнеса<br>2024</button></th><th><button data-sort=\"wage\">Зарплата, ₽<br>2024</button></th><th><button data-sort=\"housing\">Квартир в снимке<br>27.10.2026</button></th><th><button data-sort=\"access\">Работников в пределах<br><span id=\"table-time\">60 мин</span></button></th><th><button data-sort=\"vacancies\" id=\"vacancy-column\">Вакансии<br>портал «Работа России»</button></th></tr></thead><tbody id=\"comparison\"></tbody></table></div><p class=\"table-note\">Расчётный показатель доступности складывает работников организаций в доступных МО, а не свободные вакансии. Число вакансий — только объявления портала, однозначно привязанные по адресу; спорные адреса учтены отдельно.</p></section>\n<section class=\"section\"><h2><span id=\"jobs-heading\">Вакансии</span>: <span id=\"jobs-title\"></span></h2><p class=\"section-intro\" id=\"jobs-description\">Объявления портала «Работа России», сопоставленные с муниципалитетами по адресу работы. Число объявлений отличается от числа заявленных рабочих мест и не описывает всю занятость.</p><p class=\"table-note\">Названия вакансий, работодатели, адреса и поля объявлений сохранены на языке источника.</p><input id=\"job-search\" class=\"job-search\" type=\"search\" placeholder=\"Профессия или работодатель в выбранном муниципалитете\" aria-label=\"Поиск вакансий\"><div class=\"table-scroll job-table\"><table><thead><tr><th>Вакансия</th><th>Работодатель</th><th>Предлагаемая зарплата, ₽</th></tr></thead><tbody id=\"job-rows\" lang=\"ru\" data-source-text></tbody></table><p class=\"empty-table\" id=\"job-empty\" hidden></p></div><p class=\"job-meta\" id=\"job-meta\"></p><button type=\"button\" id=\"more-jobs\" class=\"plain-button\">Показать ещё</button></section>\n<section class=\"coverage\"><div class=\"panel\"><div class=\"panel-head\"><h2>Покрытие и проверка данных</h2></div><div class=\"section-body\"><ul id=\"coverage-list\" class=\"check-list\"></ul></div></div><div class=\"panel\"><div class=\"panel-head\"><h2>Чего пока не хватает</h2></div><div class=\"section-body\"><ul id=\"missing-list\" class=\"check-list\"></ul><p class=\"table-note\">Внешние центры не включены: модель ограничена республикой. Это может влиять на оценки приграничных районов.</p></div></div></section>\n<section class=\"section\"><h2>Источники и способ расчёта</h2><p class=\"section-intro\">У каждого слоя своя дата. Все 45 профилей строятся из одного набора исходных таблиц; Данные этого блока загружаются из зафиксированной версии Git; автономный HTML доступен в выпуске.</p><div id=\"sources\" class=\"source-grid\"></div><div class=\"download\"><button id=\"download-data\">Скачать данные JSON</button><button id=\"download-csv\">Скачать все 45 МО в CSV</button></div><details style=\"margin-top:18px\"><summary>Методика доступности и сценариев</summary><div class=\"notice\" style=\"margin-top:12px\"><p>Вес межрайонной связи — exp(−время/τ). Для каждого места назначения суммируется население 45 МО с такими весами, затем работники организаций этого назначения распределяются между потенциальными жителями. Доступность — сумма этих долей на одного жителя. Среднее время двух направлений используется в модели конкуренции, максимальное — для проверки порога доступности в обоих направлениях. Внутрирайонное время условно равно 10 минутам.</p><p style=\"margin-top:9px\">Сценарий прибавляет условных работников к выбранным МО. Средний эффект взвешен по населению всех 45 МО. Вариант «По численности жителей» распределяет ровно 1 000 мест с округлением методом наибольших остатков. «Выравнивать доступность» — жадная эвристика: на каждом из десяти шагов выбирается размещение 100 мест, которое больше улучшает наименьший относительный эффект по 45 МО; при равенстве сравнивается средний эффект. Глобальный оптимум для 45 МО не заявляется.</p><p style=\"margin-top:9px\">Модель не учитывает миграцию, изменение зарплат, профессиональное соответствие, стоимость строительства и ограничения транспортной системы. Сохранение массы распределённой занятости проверяет арифметику и не подтверждает соответствие фактическим трудовым поездкам.</p></div></details></section>\n</div>";
