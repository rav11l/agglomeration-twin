<section id="tw-republic-2026" style="max-width:1080px;margin:28px auto;padding:0 16px;box-sizing:border-box">
  <p role="status">Загрузка карты всех 45 муниципалитетов…</p>
</section>
<script>
(() => {
  'use strict';
  const host=document.getElementById('tw-republic-2026');
  if(!host||host.shadowRoot)return;
  const target=document.getElementById('tw-s-lvl');
  if(target){target.before(host);host.style.padding='0';}
  const nav=document.getElementById('tw-nav');
  if(nav&&!nav.querySelector('a[href="#tw-republic-2026"]')){
    const link=document.createElement('a');link.href='#tw-republic-2026';link.dataset.t='tw-republic-2026';
    link.innerHTML='<span data-ru>Работа и вакансии · 45 МО</span><span data-en>Jobs and vacancies · 45 municipalities</span>';
    const group=nav.querySelector('a[data-t="tw-eco"]')?.parentElement||nav;
    group.appendChild(link);
  }
  const root=host.attachShadow({mode:'open'});
  host.replaceChildren();
  root.innerHTML='<p role="status" style="font:14px/1.6 Inter,sans-serif;color:#5F6873">Загрузка карты всех 45 муниципалитетов…</p>';
  async function load(){
    try{
      if(!window.DecompressionStream)throw new Error('browser');
      const total=988854,step=131072;
      let loaded=0;
      const chunks=await Promise.all(Array.from({length:Math.ceil(total/step)},async(_,index)=>{
        const from=index*step,to=Math.min(total-1,from+step-1);
        const response=await fetch(DATA_URL,{headers:{Range:'bytes='+from+'-'+to},signal:AbortSignal.timeout(25000)});
        if(response.status!==206)throw new Error('HTTP '+response.status);
        const bytes=new Uint8Array(await response.arrayBuffer());
        if(bytes.length!==to-from+1)throw new Error('range length');
        loaded+=bytes.length;
        const status=root.querySelector('[role="status"]');
        if(status)status.textContent='Загрузка данных карты · '+Math.round(loaded/total*100)+'%';
        return bytes;
      }));
      const combined=new Uint8Array(total);
      chunks.forEach((bytes,index)=>combined.set(bytes,index*step));
      const buffer=combined.buffer;
      const actual=[...new Uint8Array(await crypto.subtle.digest('SHA-256',buffer))].map(x=>x.toString(16).padStart(2,'0')).join('');
      if(actual!==DATA_SHA256)throw new Error('checksum');
      const stream=new Blob([buffer]).stream().pipeThrough(new DecompressionStream('gzip'));
      const D=await new Response(stream).json();
      if(D.version!=='0.3.1'||D.profiles.length!==45||!D.checks.vacancy_region_complete)throw new Error('schema');
      root.innerHTML=MODULE_HTML;
      (function(root,D){
'use strict';
const N=D.profiles.length;
const $=id=>root.getElementById(id),NS='http://www.w3.org/2000/svg',fmt=(x,d=0)=>x==null?'нет данных':Number(x).toLocaleString('ru-RU',{maximumFractionDigits:d});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=s=>/^https:\/\//.test(s||'')?s:'#';
let selected=0,scope='all',layer='employees',threshold=60,penalty=0,tau=45,focusMap=false,sortKey='population',sortDesc=true,jobLimit=15,preset='one',plan=Array(N).fill(0),currentModel;
plan[0]=1000;
const FULL=!!D.checks.vacancy_region_complete;
const geoById=Object.fromEntries(D.geometry.map(r=>[r.id,r]));
const LAYERS=[{id:'population',name:'Население',unit:'жителей',date:'Росстат · 01.01.2024 · население муниципалитета',get:p=>p.population},{id:'employees',name:'Занятость',unit:'работников без МСП',date:'Росстат · 2024 · работники организаций без МСП',get:p=>p.employees},{id:'wage',name:'Зарплата',unit:'₽ в месяц',date:'Росстат · 2024 · средняя начисленная зарплата по месту работы',get:p=>p.wage},{id:'ratio',name:'На 100 жителей',unit:'работников без МСП на 100 жителей',date:'Работники организаций / население × 100 · не доля занятых жителей',get:p=>p.workers_per100},{id:'housing',name:'Жильё',unit:'квартир в снимке ЕИСЖС',date:'ЕИСЖС · 27.10.2026 · координаты сопоставлены с границами МО',get:p=>p.housing.flats},{id:'access',name:'Доступность',unit:'работников в доступных МО',date:'Модель · автомобиль между центрами МО · в обоих направлениях',get:(p,i)=>potential(i)}];
if(FULL)LAYERS.push({id:'vacancies',name:'Вакансии',unit:'привязанных объявлений портала',date:'Работа России · 26.11.2026 · полный региональный срез, привязка по адресу работы',get:p=>p.vacancies.postings||0});
function visibleIndices(){return D.profiles.map((p,i)=>i).filter(i=>scope==='all'||(scope==='outside'?!D.profiles[i].memberships.length:D.profiles[i].memberships.some(m=>m.name===scope)))}
function computeModel(tauValue=tau,added=plan){const R=D.profiles,W=R.map((_,i)=>R.map((_,j)=>Math.exp(-(i===j?10:(D.times[i][j]+D.times[j][i])/2+penalty)/tauValue)));const demand=R.map((_,j)=>R.reduce((s,r,k)=>s+r.population*W[k][j],0));const access=R.map((_,i)=>R.reduce((s,r,j)=>s+r.employees*W[i][j]/demand[j],0));const coefficient=R.map((_,i)=>R.map((_,j)=>W[i][j]/demand[j]/access[i]));const gain=coefficient.map(c=>c.reduce((s,x,j)=>s+x*added[j],0));const totalP=R.reduce((s,r)=>s+r.population,0);return{W,demand,access,coefficient,gain,mean:gain.reduce((s,g,i)=>s+g*R[i].population,0)/totalP,min:Math.min(...gain)}}
function populationPlan(){const P=D.profiles.map(r=>r.population),total=P.reduce((a,b)=>a+b,0),raw=P.map(p=>p/total*1000),a=raw.map(Math.floor),order=raw.map((x,i)=>({i,r:x-a[i]})).sort((x,y)=>y.r-x.r||x.i-y.i);for(let k=0,left=1000-a.reduce((x,y)=>x+y,0);k<left;k++)a[order[k].i]++;return a}
function equalizePlan(){const base=computeModel(tau,Array(N).fill(0)),q=Array(N).fill(0),g=Array(N).fill(0),totalP=D.profiles.reduce((s,p)=>s+p.population,0);for(let step=0;step<10;step++){let best=0,bestMin=-Infinity,bestMean=-Infinity;for(let j=0;j<N;j++){let mn=Infinity,avg=0;for(let i=0;i<N;i++){const v=g[i]+100*base.coefficient[i][j];mn=Math.min(mn,v);avg+=v*D.profiles[i].population/totalP}if(mn>bestMin+1e-14||(Math.abs(mn-bestMin)<1e-14&&avg>bestMean)){best=j;bestMin=mn;bestMean=avg}}q[best]+=100;for(let i=0;i<N;i++)g[i]+=100*base.coefficient[i][best]}return q}
function potential(i){return D.profiles.reduce((s,r,j)=>s+((i===j?10:Math.max(D.times[i][j],D.times[j][i])+penalty)<=threshold?r.employees:0),0)}
function catchment(i){return D.profiles.reduce((s,r,j)=>s+((i===j?10:Math.max(D.times[i][j],D.times[j][i])+penalty)<=threshold?r.population:0),0)}
function color(v,min,max){const q=max===min?.5:(v-min)/(max-min),a=[231,238,246],b=[29,78,140];return `rgb(${a.map((x,i)=>Math.round(x+(b[i]-x)*q)).join(',')})`}
function svgEl(tag,attrs={}){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);return e}
function drawMap(){const visible=visibleIndices(),set=new Set(visible),l=LAYERS.find(l=>l.id===layer),values=D.profiles.map(l.get),lo=Math.min(...visible.map(i=>values[i])),hi=Math.max(...visible.map(i=>values[i])),svg=$('map');svg.replaceChildren();let shapes=(focusMap?[selected]:visible).map(i=>geoById[D.profiles[i].slug]);const pts=shapes.flatMap(r=>[...r.path.matchAll(/(-?[\d.]+),(-?[\d.]+)/g)].map(m=>[+m[1],+m[2]])),xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);const x=Math.min(...xs)-9,y=Math.min(...ys)-9,w=Math.max(...xs)-x+9,h=Math.max(...ys)-y+9;svg.setAttribute('viewBox',`${x} ${y} ${w} ${h}`);D.profiles.forEach((p,i)=>{const r=geoById[p.slug],path=svgEl('path',{d:r.path,class:(!set.has(i)?'context':'zone')+(i===selected?' selected':''),fill:set.has(i)?color(values[i],lo,hi):'#e0e7ed',tabindex:0,role:'button','aria-label':p.name+': '+fmt(values[i],layer==='ratio'?1:0)+' '+l.unit});const title=svgEl('title');title.textContent=path.getAttribute('aria-label');path.append(title);path.addEventListener('click',()=>selectCenter(i));path.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectCenter(i)}});svg.append(path)});const font=Math.max(1.2,Math.min(11,w/43));D.profiles.forEach((p,i)=>{if(!set.has(i)||(!$('show-labels').checked&&!p.is_core&&i!==selected&&!focusMap))return;const r=geoById[p.slug],label=svgEl('text',{x:r.cx,y:r.cy,'text-anchor':'middle',class:'map-label',style:`font-size:${font}px;stroke-width:${font*.27}px`});label.textContent=p.short;svg.append(label)});$('map-subtitle').textContent=l.date;$('legend-min').textContent=fmt(lo,layer==='ratio'?1:0);$('legend-max').textContent=fmt(hi,layer==='ratio'?1:0);$('legend-unit').textContent=l.unit;$('visible-count').textContent=visible.length+' из 45 МО';$('focus-map').textContent=focusMap?'Показать весь выбранный охват':'Приблизить выбранный район';$('map-tabs').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layer===layer)))}
function selectCenter(i){selected=i;jobLimit=15;if(!visibleIndices().includes(i)){scope='all';$('scope').value='all'}$('center').value=String(i);$('job-search').value='';if(preset==='one'){plan=Array(N).fill(0);plan[i]=1000}renderScenario();drawMap();renderProfile();renderTable();renderJobs()}
function renderProfile(){const p=D.profiles[selected],v=p.vacancies,tag=p.memberships.map(m=>m.name+' · '+m.belt+' пояс').join('; ')||'Вне поясов трёх агломераций';$('profile-title').textContent=p.name;$('profile').innerHTML=`<p class="meta">${esc(tag)}</p><span class="type-label" style="margin-top:12px">Наблюдения · 2024</span><div class="profile-kpis" style="margin-top:15px">${[['Жителей',p.population],['Работников без МСП',p.employees],['Зарплата, ₽',p.wage],['Работников на 100 жителей',p.workers_per100]].map(([label,n],i)=>`<div><div class="pkv">${fmt(n,i===3?1:0)}</div><div class="pkl">${esc(label)}</div></div>`).join('')}</div><div class="rule"></div><h3>В пределах ${threshold} минут</h3><p class="meta">${fmt(potential(selected))} работников организаций</p><p class="meta">${fmt(catchment(selected))} жителей доступных МО</p><p class="table-note">Потенциальная доступность на машине, не фактические поездки.</p><div class="rule"></div><h3>Жильё в снимке ЕИСЖС</h3><p class="meta">${fmt(p.housing.buildings)} объектов · ${fmt(p.housing.flats)} квартир</p><p class="meta">27.10.2026 · привязка к границам МО</p>${!p.housing.buildings?'<p class="table-note">Объекты в использованном снимке не найдены; это не оценка всего жилищного фонда.</p>':''}<div class="rule"></div><h3>${FULL?'Вакансии портала':'Примеры вакансий'}</h3>${v.postings==null?'<div class="notice amber" style="margin-top:8px">Подборка для этой территории не собрана. Ноль вакансий из этого не следует.</div>':`<p class="meta">${fmt(v.postings)} объявлений с адресами в этом МО</p><p class="meta">Медиана нижней границы зарплаты: ${v.salary_floor_median==null?'нет данных':fmt(v.salary_floor_median)+' ₽'} · ${fmt(v.salary_floor_n||0)} объявлений с зарплатой</p>${FULL?(v.categories||[]).slice(0,3).map(([cat,n])=>`<div class="category"><span>${esc(cat)}</span><b>${fmt(n)}</b></div><div class="bar-bg"><div class="bar" style="width:${100*n/Math.max(1,v.postings)}%"></div></div>`).join(''):''}<p class="table-note">${FULL?'Сферы объявлений портала; это не отраслевая структура работающих жителей.':'Подборка неполная; частоты не интерпретируются как структура рынка.'}</p>`}`}
function renderRoutes(){const i=selected,R=D.profiles,W=currentModel.W,weighted=R.reduce((s,r,j)=>s+r.employees*W[i][j],0),outside=1-R[i].employees*W[i][i]/weighted,alts=R.map((r,j)=>({r,j,weight:r.employees*W[i][j]})).filter(x=>x.j!==i).sort((a,b)=>b.weight-a.weight).slice(0,5);$('route-intro').textContent=R[i].name+': '+fmt(outside*100,1)+'% взвешенной занятости находится вне этого муниципалитета. Крупнейшие альтернативы по числу работников и дорожному времени:';$('routes').innerHTML=alts.map(({r,j})=>`<div class="route-row"><div>${esc(r.name)}<small>${fmt(r.employees)} работников без МСП · зарплата ${fmt(r.wage)} ₽</small></div><strong>${fmt((D.times[i][j]+D.times[j][i])/2+penalty,1)} мин</strong></div>`).join('')}
function renderScenario(){currentModel=computeModel();$('gain-mean').textContent='+'+fmt(currentModel.mean*100,3)+'%';$('gain-min').textContent='+'+fmt(currentModel.min*100,3)+'%';const total=plan.reduce((s,j)=>s+j,0);$('scenario-note').textContent=`Всего добавлено ${fmt(total)} условных мест. Эффект считается по всей республике.${total!==1000?' Сумма сейчас отличается от 1 000.':''}${preset==='equalize'?' Выравнивание — эвристика, не глобальный оптимум.':''}`;$('allocation-name').textContent=D.profiles[selected].name;$('selected-jobs').value=plan[selected];$('presets').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.preset===preset)));$('allocations').innerHTML=D.profiles.map((p,i)=>`<tr data-center="${i}"><td>${esc(p.name)}</td><td>${fmt(plan[i])}</td><td>+${fmt(currentModel.gain[i]*100,3)}%</td></tr>`).join('');$('allocations').querySelectorAll('tr').forEach(r=>r.addEventListener('click',()=>selectCenter(+r.dataset.center)));renderRoutes()}
function renderTable(){const query=$('table-search').value.trim().toLowerCase(),visible=visibleIndices(),indices=visible.filter(i=>D.profiles[i].name.toLowerCase().includes(query)),get=i=>sortKey==='housing'?D.profiles[i].housing.flats:sortKey==='access'?potential(i):sortKey==='vacancies'?(D.profiles[i].vacancies.postings??-1):D.profiles[i][sortKey];indices.sort((a,b)=>{let x=get(a),y=get(b),c=typeof x==='string'?x.localeCompare(y,'ru'):x-y;return(sortDesc?-1:1)*c||a-b});$('table-time').textContent=threshold+' мин';$('table-count').textContent='Показано '+indices.length+' из '+visible.length;$('comparison').innerHTML=indices.map(i=>{const p=D.profiles[i];return `<tr tabindex="0" data-center="${i}" class="${i===selected?'selected':''}"><td><strong>${esc(p.name)}</strong></td><td>${fmt(p.population)}</td><td>${fmt(p.employees)}</td><td>${fmt(p.wage)}</td><td>${fmt(p.housing.flats)}</td><td>${fmt(potential(i))}</td><td>${p.vacancies.postings==null?'<span class="meta">не собрано</span>':fmt(p.vacancies.postings)}</td></tr>`}).join('');$('comparison').querySelectorAll('tr').forEach(r=>{r.addEventListener('click',()=>selectCenter(+r.dataset.center));r.addEventListener('keydown',e=>{if(e.key==='Enter')selectCenter(+r.dataset.center)})});root.querySelectorAll('[data-sort]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.sort===sortKey));b.title=b.dataset.sort===sortKey?(sortDesc?'По убыванию':'По возрастанию'):'Сортировать'})}
function renderJobs(){const p=D.profiles[selected],q=$('job-search').value.trim().toLowerCase(),rows=p.vacancies.records.filter(r=>!q||`${r.title} ${r.employer}`.toLowerCase().includes(q));$('jobs-title').textContent=p.name;$('job-rows').innerHTML=rows.slice(0,jobLimit).map(r=>{let salary=r.salary_min?'от '+fmt(r.salary_min):r.salary_max?'до '+fmt(r.salary_max):'не указана';return `<tr><td><a href="${esc(safeUrl(r.url))}" target="_blank" rel="noopener">${esc(r.title)}</a><small>${esc(r.schedule||r.employment||'')} · ${esc(r.specialisation||'Сфера не указана')}</small></td><td>${esc(r.employer||'Не указан')}<small>${esc((r.addresses||[]).map(a=>a.location).join('; '))}</small></td><td>${salary}${r.salary_min&&r.salary_max>r.salary_min?'–'+fmt(r.salary_max):''}</td></tr>`}).join('');$('job-empty').hidden=rows.length>0;$('job-empty').textContent=p.vacancies.state==='not_collected'?'Для этого муниципалитета подборка не собрана. Это не означает отсутствие вакансий.':FULL?'По этому запросу в привязанных объявлениях портала ничего не найдено.':'По этому запросу в подборке ничего не найдено.';$('more-jobs').hidden=rows.length<=jobLimit;$('job-meta').textContent=p.vacancies.postings==null?'Для вывода о рынке труда необходима полноценная выгрузка.':(FULL?`Показано ${Math.min(jobLimit,rows.length)} из ${rows.length} объявлений выбранного МО. Источник: «Работа России», 26.11.2026.`:`Показано ${Math.min(jobLimit,rows.length)} из ${rows.length} примеров. Подборка неполная.`)}
function download(name,text,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}

gradient\"></span><span id=\"legend-max\"></span></div><span id=\"legend-unit\" class=\"meta\"></span></div><p class=\"map-foot\">© участники OpenStreetMap · ODbL. Районы и городские округа показаны раздельно. Для маленького контура используйте список справа.</p><div class=\"controls\"><div><label class=\"control-label\" for=\"threshold\">Порог доступности <output id=\"threshold-out\">60 мин</output></label><input id=\"threshold\" type=\"range\" min=\"30\" max=\"120\" step=\"5\" value=\"60\"><p class=\"control-help\">В обоих направлениях на машине между центрами МО.</p></div><div><label class=\"control-label\" for=\"penalty\">Условная задержка <output id=\"penalty-out\">0 мин</output></label><input id=\"penalty\" type=\"range\" min=\"0\" max=\"30\" step=\"5\" value=\"0\"><p class=\"control-help\">Добавка к межрайонной поездке, без изменения внутреннего времени.</p></div></div></div>\n<aside class=\"panel\"><div class=\"profile-top\"><span class=\"meta\">Выберите муниципалитет</span><select id=\"center\" aria-label=\"Муниципалитет Татарстана\"></select><h2 id=\"profile-title\" class=\"profile-title\"></h2></div><div id=\"profile\" class=\"profile-body\"></div></aside></section>\n<section class=\"below\"><div class=\"panel\"><div class=\"panel-head\"><h2>Размещение новых рабочих мест</h2><span class=\"type-label model\">Сценарий · 45 МО</span></div><div class=\"section-body\"><p class=\"scenario-intro\">Сравните размещение 1 000 условных мест. Влияние оценивается для всех жителей республики; стоимость создания мест в модель не входит.</p><div class=\"scenario-actions\" id=\"presets\"><button data-preset=\"one\" aria-pressed=\"true\">В выбранный район</button><button data-preset=\"population\" aria-pressed=\"false\">По численности жителей</button><button data-preset=\"equalize\" aria-pressed=\"false\">Выравнивать доступность</button></div><label class=\"allocation-editor\" for=\"selected-jobs\"><span>Новых мест: <strong id=\"allocation-name\"></strong></span><input id=\"selected-jobs\" type=\"number\" min=\"0\" max=\"100000\" step=\"100\" value=\"1000\"></label><p class=\"control-help\">Можно последовательно выбрать несколько районов и задать число мест в каждом.</p><div class=\"scenario-result\"><div><strong id=\"gain-mean\"></strong><span>средний прирост по 45 МО</span></div><div><strong id=\"gain-min\"></strong><span>наименьший прирост по 45 МО</span></div></div><p class=\"table-note\" id=\"scenario-note\"></p><details class=\"allocation-details\"><summary>Распределение мест и эффект по всем районам</summary><div class=\"table-scroll\"><table><thead><tr><th>Муниципалитет</th><th>Новых мест</th><th>Прирост</th></tr></thead><tbody id=\"allocations\"></tbody></table></div></details><div style=\"margin-top:17px\"><label class=\"control-label\" for=\"tau\">Чувствительность к времени <output id=\"tau-out\">45 мин</output></label><input id=\"tau\" type=\"range\" min=\"20\" max=\"60\" value=\"45\" step=\"5\"><p class=\"control-help\">Меньший параметр сильнее уменьшает вес далёких мест.</p></div></div></div>\n<div class=\"panel\"><div class=\"panel-head\"><h2>Связи выбранной территории</h2><span class=\"type-label model\">Модель</span></div><div class=\"section-body\"><p class=\"scenario-intro\" id=\"route-intro\"></p><div id=\"routes\"></div><div class=\"notice\" style=\"margin-top:15px\">Это потенциальная доступность. Число работников взвешивается временем в пути; фактические поездки жителей не наблюдаются. Автобусные расписания, квалификация и занятость МСП в этот расчёт не входят.</div></div></div></section>\n<section class=\"section\"><h2>Сравнение всех муниципалитетов</h2><p class=\"section-intro\">Район включает город и сельские поселения. Казань и Набережные Челны — отдельные городские округа. Нажмите на название столбца для сортировки.</p><div class=\"table-tools\"><input id=\"table-search\" type=\"search\" class=\"job-search\" placeholder=\"Найти район или городской округ\" aria-label=\"Поиск муниципалитетов\"><span id=\"table-count\" class=\"meta\"></span></div><div class=\"table-scroll compare-scroll\"><table><thead><tr><th><button data-sort=\"name\">Муниципалитет</button></th><th><button data-sort=\"population\">Жителей<br>01.01.2024</button></th><th><button data-sort=\"employees\">Работников без МСП<br>2024</button></th><th><button data-sort=\"wage\">Зарплата, ₽<br>2024</button></th><th><button data-sort=\"housing\">Квартир в снимке<br>27.10.2026</button></th><th><button data-sort=\"access\">Работников в пределах<br><span id=\"table-time\">60 мин</span></button></th><th><button data-sort=\"vacancies\" id=\"vacancy-column\">Вакансии<br>портал «Работа России»</button></th></tr></thead><tbody id=\"comparison\"></tbody></table></div><p class=\"table-note\">Расчётный показатель доступности складывает работников организаций в доступных МО, а не свободные вакансии. Число вакансий — только объявления портала, однозначно привязанные по адресу; спорные адреса учтены отдельно.</p></section>\n<section class=\"section\"><h2><span id=\"jobs-heading\">Вакансии</span>: <span id=\"jobs-title\"></span></h2><p class=\"section-intro\" id=\"jobs-description\">Объявления портала «Работа России», сопоставленные с муниципалитетами по адресу работы. Число объявлений отличается от числа заявленных рабочих мест и не описывает всю занятость.</p><input id=\"job-search\" class=\"job-search\" type=\"search\" placeholder=\"Профессия или работодатель в выбранном муниципалитете\" aria-label=\"Поиск вакансий\"><div class=\"table-scroll job-table\"><table><thead><tr><th>Вакансия</th><th>Работодатель</th><th>Предлагаемая зарплата, ₽</th></tr></thead><tbody id=\"job-rows\"></tbody></table><p class=\"empty-table\" id=\"job-empty\" hidden></p></div><p class=\"job-meta\" id=\"job-meta\"></p><button type=\"button\" id=\"more-jobs\" class=\"plain-button\">Показать ещё</button></section>\n<section class=\"coverage\"><div class=\"panel\"><div class=\"panel-head\"><h2>Покрытие и проверка данных</h2></div><div class=\"section-body\"><ul id=\"coverage-list\" class=\"check-list\"></ul></div></div><div class=\"panel\"><div class=\"panel-head\"><h2>Чего пока не хватает</h2></div><div class=\"section-body\"><ul id=\"missing-list\" class=\"check-list\"></ul><p class=\"table-note\">Внешние центры не включены: модель ограничена республикой. Это может влиять на оценки приграничных районов.</p></div></div></section>\n<section class=\"section\"><h2>Источники и способ расчёта</h2><p class=\"section-intro\">У каждого слоя своя дата. Все 45 профилей строятся из одного набора исходных таблиц; Данные этого блока загружаются из зафиксированной версии Git; автономный HTML доступен в выпуске.</p><div id=\"sources\" class=\"source-grid\"></div><div class=\"download\"><button id=\"download-data\">Скачать данные JSON</button><button id=\"download-csv\">Скачать все 45 МО в CSV</button></div><details style=\"margin-top:18px\"><summary>Методика доступности и сценариев</summary><div class=\"notice\" style=\"margin-top:12px\"><p>Вес межрайонной связи — exp(−время/τ). Для каждого места назначения суммируется население 45 МО с такими весами, затем работники организаций этого назначения распределяются между потенциальными жителями. Доступность — сумма этих долей на одного жителя. Среднее время двух направлений используется в модели конкуренции, максимальное — для проверки порога доступности в обоих направлениях. Внутрирайонное время условно равно 10 минутам.</p><p style=\"margin-top:9px\">Сценарий прибавляет условных работников к выбранным МО. Средний эффект взвешен по населению всех 45 МО. Вариант «По численности жителей» распределяет ровно 1 000 мест с округлением методом наибольших остатков. «Выравнивать доступность» — жадная эвристика: на каждом из десяти шагов выбирается размещение 100 мест, которое больше улучшает наименьший относительный эффект по 45 МО; при равенстве сравнивается средний эффект. Глобальный оптимум для 45 МО не заявляется.</p><p style=\"margin-top:9px\">Модель не учитывает миграцию, изменение зарплат, профессиональное соответствие, стоимость строительства и ограничения транспортной системы. Сохранение массы распределённой занятости проверяет арифметику и не подтверждает соответствие фактическим трудовым поездкам.</p></div></details></section>\n</div>";
