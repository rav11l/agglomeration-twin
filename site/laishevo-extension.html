<style>

#tw-laish .lp-track{height:8px;background:var(--lp-soft);border-radius:2px;overflow:hidden}

#tw-laish .lp-steps{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;margin:14px 0}

#tw-laish .lp-steps i{font-style:normal;padding:5px 0;color:var(--lp-muted)}
#tw-laish .lp-warning{color:var(--lp-orange);font-weight:500}
#tw-laish .lp-result{font-size:14px;margin:12px 0;min-height:24px}
#tw-laish .lp-sources{font-size:12px;color:var(--lp-muted)}
#tw-laish .lp-sources ol{margin:8px 0;padding-left:20px}
#tw-laish .lp-sources li{padding-left:3px}
#tw-laish .lp-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0}
#tw-laish select{max-width:100%;padding:8px;border:1px solid var(--lp-line);border-radius:4px;font:inherit;color:var(--lp-ink);background:var(--lp-card)}
#tw-laish .lp-districts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
#tw-laish .lp-districts article{border-left:2px solid var(--lp-line);padding-left:12px;min-width:0}
#tw-laish .lp-districts b{display:block;font-size:14px}
#tw-laish .lp-districts p{font-size:13px;margin:5px 0}
@media(max-width:700px){#tw-laish section.lp-section{padding:18px}#tw-laish .lp-alts,#tw-laish .lp-rail{grid-template-columns:1fr}#tw-laish .lp-alt strong{margin-bottom:3px}#tw-laish .lp-controls{grid-template-columns:1fr 1fr}#tw-laish .lp-metrics{gap:12px}#tw-laish .lp-metric b{font-size:25px}#tw-laish h2{font-size:24px}#tw-laish .lp-districts{grid-template-columns:1fr}#tw-laish table{min-width:550px}}
@media(max-width:420px){#tw-laish .lp-controls{grid-template-columns:1fr}#tw-laish .lp-control>span{min-height:0}#tw-laish .lp-metrics{grid-template-columns:1fr}#tw-laish .lp-metric{display:flex;justify-content:space-between;gap:14px;align-items:center}#tw-laish .lp-metric span{max-width:60%;text-align:right;margin:0}}
@media(prefers-reduced-motion:reduce){#tw-laish .lp-fill{transition:none}}
@media(pointer:coarse){#tw-laish input[type="range"],#tw-laish summary,#tw-laish select{min-height:44px}#tw-laish select{font-size:16px}}
</style>

</script>
<script>
(function(){
'use strict';
const root=document.getElementById('tw-laish');if(!root)return;
const host=document.getElementById('dgl-tw');
let lang=host?.getAttribute('data-lang')==='en'?'en':'ru';
const L=(r,e)=>lang==='en'?e:r;
const source={
air:'https://tida.tatar.ru/index.htm/news/2572898.htm',
ipp:'https://ipp.tatar.ru/index.htm/news/2563653.htm',
population:'https://www.tatar-inform.ru/news/laisevo-2050-park-attrakcionovkinostudiya-stadion-i-10-kilometrovaya-nabereznaya-6047763',
beach:'https://www.tatar-inform.ru/news/v-tatarstane-predlozili-razrabotat-strategiyu-razvitiya-plyaznoi-infrastruktury-6047733',
rv:'https://realnoevremya.ru/articles/410175-glava-laishevo-prezentoval-koncepciyu-razvitiya-do-2050-goda',
rail:'https://www.kommersant.ru/doc/7924570',
rail2026:'https://www.tatar-inform.ru/news/koncepciyu-razvitiya-laisevo-do-2050-goda-predstavyat-v-konce-leta-6023874',
ppk:'https://sodruzhestvoppk.ru/',
nomis:'https://www.nomisweb.co.uk/reports/lmp/lad/1778384937/report.aspx',
nationalrail:'https://www.nationalrail.co.uk/discover-by-train/great-british-destinations/visit-brighton-by-train/',
brightonplan:'https://www.brighton-hove.gov.uk/sites/default/files/2024-11/8080%20Economic%20Plan%202024-2027%20r20_.pdf',
brightonmap:'https://www.visitbrighton.com/plan-your-visit/visitor-information/maps'
};
const defaults={alt:'phased',units:2000,occupied:70,household:2.5,employed:55,localJobs:40,visitors:3000,carOccupancy:3,parking:500,stress:100,walk:10,feeder:30,wait:15,ride:45,last:10,limit:90};
let s={...defaults};
const specs={units:[0,6000,100],occupied:[0,100,5],household:[1,4,.1],employed:[0,100,5],localJobs:[0,100,5],visitors:[0,30000,100],carOccupancy:[1,5,.1],parking:[0,4000,50],walk:[0,45,5],feeder:[0,120,5],wait:[0,60,5],ride:[0,180,5],last:[0,60,5],limit:[30,180,5]};
const alternatives={
 bus:{name:['Автобусы и местная работа','Buses and local jobs'],brief:['Регулярные маршруты круглый год. Развитие не ждёт новой линии.','Year-round services. Development does not wait for a new line.'],share:70,
 housing:['Небольшие очереди жилья рядом с существующими услугами; заказчики рабочих мест определены до расширения застройки.','Small housing phases near existing services; employers identified before expansion.'],
 summer:['Усиленные автобусы и управление парковкой. Основной риск — те же дорожные заторы, что у автомобилей.','Extra buses and parking management. Main risk: buses face the same road congestion as cars.'],
 belt:['Первый шаг — прямые регулярные маршруты из выбранных населённых пунктов второго пояса к работе, учёбе и медицине. Расписание под смены, а не только под пляж.','Start with regular direct routes from selected second-belt settlements to work, education and healthcare. Timetables match shifts, not just beach demand.'],
 gate:['Перед заселением очереди: подтверждены места в школах, вода и очистные; заключён договор на круглогодичное сообщение.','Before occupancy: school places, water and wastewater capacity, and a year-round service contract are secured.'],
 risk:['Меньше новой капитальной инфраструктуры; ежегодные расходы на перевозки. Надёжность зависит от дорожной ситуации.','Less new capital infrastructure; recurring service costs. Reliability depends on road congestion.']},
 phased:{name:['Рост по готовности инфраструктуры','Growth tied to infrastructure'],brief:['Жильё очередями, местные услуги и подвоз к действующей железной дороге.','Phased housing, local services and feeders to the existing railway.'],share:50,
 housing:['Каждая очередь жилья связана с вводом услуг, рабочих мест и транспорта. Сначала проверяется спрос на подвоз к действующей аэропортовой ветке.','Each housing phase is tied to services, jobs and transport. Test demand for feeders to the existing airport line first.'],
 summer:['Перехватывающая парковка, отдельные сезонные шаттлы, свободный проход к воде. Пересадка полезна только при согласованном расписании.','Peripheral parking, separate seasonal shuttles and public waterfront access. Transfers help only with coordinated timetables.'],
 belt:['Подвоз проверяется на конкретных маршрутах второго пояса. Сравниваются прямая поездка и вариант через станцию: пересадка может удлинить путь.','Test feeders on specific second-belt routes. Compare a direct service with a station transfer: changing vehicles can make a trip longer.'],
 gate:['Следующая очередь открывается после проверки фактического заселения, вместимости услуг и стабильного времени в пути зимой и летом.','Release the next phase after checking actual occupancy, service capacity and reliable winter and summer travel times.'],
 risk:['Поэтапные вложения и регулярные расходы на подвоз. Нужна координация муниципалитетов и перевозчиков; станция аэропорта не равна станции в Лаишево.','Phased investment and recurring feeder costs. Municipalities and operators must coordinate; the airport station is not a station in Laishevo.']},
 rail:{name:['Рост с новой железной дорогой','Growth with a new railway'],brief:['Продление до Лаишево — после проверки спроса и подтверждения проекта.','An extension to Laishevo after demand and project delivery are verified.'],share:35,
 housing:['Новые очереди у будущего узла — после утверждения места станции, финансирования и программы движения. Постоянная работа в городе остаётся отдельной задачей.','New housing near a future hub follows a confirmed station location, funding and service plan. Local year-round jobs remain a separate requirement.'],
 summer:['Поезд, пеший путь к городу и подвоз к берегу. Пропускная способность определяется расписанием и вместимостью, а не наличием рельсов.','Train, walkable access to town and waterfront feeders. Capacity depends on timetables and vehicle capacity, not the tracks alone.'],
 belt:['Продление только до Лаишево не даёт второму поясу собственных станций. Для Алексеевского и Чистопольского направлений нужен следующий этап; для остальных — отдельный подвоз.','An extension only to Laishevo gives the second belt no stations of its own. Alekseevsky and Chistopolsky directions require a later stage; other areas need feeders.'],
 gate:['Нужны утверждённый проект, финансирование, пассажирский прогноз по сезонам, доступный тариф и обязательства по круглогодичному расписанию.','Requires an approved project, funding, seasonal ridership estimates, affordable fares and a year-round service commitment.'],
 risk:['Крупные необратимые вложения и риск задержки. Без стоимости строительства и операционной модели окупаемость не рассчитывается.','Large irreversible investment and delay risk. No return estimate without construction costs and an operating model.']}
};
function n(x,d=0){return new Intl.NumberFormat(lang==='en'?'en-GB':'ru-RU',{maximumFractionDigits:d}).format(x)}
function a(key,label){return `<a href="${source[key]}" target="_blank" rel="noopener noreferrer">${label}</a>`}
function control(key,label,unit=''){const [min,max,step]=specs[key];return `<label class="lp-control" for="lp-${key}"><span>${label}<output id="lp-o-${key}" for="lp-${key}">${n(s[key],step<1?1:0)}${unit}</output></span><input type="range" id="lp-${key}" data-key="${key}" min="${min}" max="${max}" step="${step}" value="${s[key]}" data-unit="${unit}"></label>`}
function metric(id,label){return `<div class="lp-metric"><b id="${id}"></b><span>${label}</span></div>`}
function model(v){const newResidents=v.units*v.occupied/100*v.household;const workers=newResidents*v.employed/100;const peak=v.visitors*v.stress/100;const cars=peak*alternatives[v.alt].share/100/v.carOccupancy;return {newResidents,total:10700+newResidents,workers,outbound:workers*(1-v.localJobs/100),local:workers*v.localJobs/100,needed:v.occupied>0?Math.ceil(6300/(v.occupied/100*v.household)):null,peak,cars:Math.ceil(cars),other:peak*(1-alternatives[v.alt].share/100),travel:v.walk+v.feeder+v.wait+v.ride+v.last};}
function build(){
document.getElementById('tw-l-pop').innerHTML=`
 <div class="lp-kicker">${L('01 · Заселение · проверено 04.11.2026','01 · Settlement · checked 4 Nov 2026')}</div>
 <h2>${L('Лаишево: жильё, работа и второй пояс','Laishevo: housing, jobs and the second belt')}</h2>
 <p>${L('В исходной классификации двойника Лаишевский район — первый пояс Казани. Новый центр на берегу полезен второму поясу, если до его рабочих мест и услуг можно добраться круглый год. Ни жильё, ни курорт, ни железная дорога сами по себе этого не гарантируют.','The twin’s baseline classification places Laishevsky District in Kazan’s first belt. A new waterfront centre benefits the second belt when its jobs and services are accessible year-round. Housing, a resort or a railway alone cannot ensure that.')}</p>
 <div class="lp-context"><p>${L('<b>Что подтверждено.</b> ИПП РТ представил разработанную им концепцию «Лаишево-2050» на площадке АИР РТ 3 ноября 2026 года. Это этап планирования. В репортаже с презентации названы 10,7 тыс. жителей города сейчас и ориентир 17 тыс. к 2050 году. Это показатели города, не всего Лаишевского района.','<b>Evidence.</b> Tatarstan’s Institute for Spatial Planning presented its Laishevo 2050 concept at the republic’s Investment Development Agency on 3 November 2026. This is a planning stage. Presentation reporting gives 10.7k current city residents and a 17k target for 2050. These are city figures, not district totals.')} ${a('air',L('Сообщение АИР РТ','Agency announcement'))} · ${a('population',L('Показатели и статус концепции','Figures and concept status'))}</p></div>
 <p class="lp-sub">${L('Три альтернативы развития. Выбор меняет программу действий и условную долю автомобильных поездок в летнем расчёте. Объём заселения общий для всех вариантов.','Three development alternatives. Selection changes the action programme and the illustrative summer car share. Housing demand is shared across all alternatives.')}</p>
 <div class="lp-alts">${Object.entries(alternatives).map(([k,v])=>`<button type="button" class="lp-alt" data-alt="${k}" aria-pressed="${s.alt===k}"><strong>${L(...v.name)}</strong><span>${L(...v.brief)}</span></button>`).join('')}</div>
 <div class="lp-strategy" id="lp-strategy"></div>
 <h3>${L('От введённого жилья к постоянным жителям','From completed housing to permanent residents')}</h3>
 <p class="lp-small">${L('Все ползунки ниже — допущения для проверки чувствительности. Они не являются планом ввода или прогнозом населения.','All sliders below are sensitivity assumptions, not an approved housing programme or population forecast.')}</p>
 <div class="lp-controls">${control('units',L('Новых единиц жилья','New housing units'))}${control('occupied',L('Постоянно заселены','Permanently occupied'),' %')}${control('household',L('Человек в заселённом жилье','People per occupied unit'))}</div>
 <div class="lp-metrics" aria-live="polite">${metric('lp-new',L('новых постоянных жителей','new permanent residents'))}${metric('lp-total',L('жителей с условной базой 10,7 тыс.','residents, using the 10.7k reference'))}${metric('lp-needed',L('новых единиц жилья для прироста 6,3 тыс.','new units needed for a 6.3k increase'))}</div>
 <p class="lp-result" id="lp-occupancy-note"></p>
 <details><summary>${L('Рабочие места и границы расчёта','Employment and model boundaries')}</summary><div>
 <div class="lp-controls">${control('employed',L('Занятых среди новых жителей','Employed share of new residents'),' %')}${control('localJobs',L('Из них работают в городе','Of these, working in the city'),' %')}</div>
 <p id="lp-employment" aria-live="polite"></p>

function update(){
 const m=model(s),alt=alternatives[s.alt];
 const put=(id,text)=>{root.querySelector('#'+id).textContent=text};
 root.querySelectorAll('button[data-alt]').forEach(b=>{const selected=b.dataset.alt===s.alt;b.setAttribute('aria-pressed',String(selected));b.style.setProperty('background-color',selected?'var(--lp-accent)':'var(--lp-paper)','important');b.style.setProperty('color',selected?'#fff':'var(--lp-ink)','important');b.style.setProperty('border-color',selected?'var(--lp-accent)':'var(--lp-line)','important');b.querySelectorAll('strong,span').forEach(el=>el.style.setProperty('color','inherit','important'))});
 root.querySelectorAll('input[data-key]').forEach(el=>{el.value=s[el.dataset.key];put('lp-o-'+el.dataset.key,n(s[el.dataset.key],Number(el.step)<1?1:0)+(el.dataset.unit||''))});
 put('lp-strategy',L(...alt.housing));put('lp-gate',L(...alt.gate));put('lp-summer-strategy',L(...alt.summer));put('lp-belt-strategy',L(...alt.belt));
 put('lp-new',n(m.newResidents));put('lp-total',n(m.total));put('lp-needed',m.needed===null?'—':n(m.needed));
 put('lp-occupancy-note',s.occupied===0?L('При нулевом постоянном заселении прирост постоянных жителей равен нулю; требуемый объём жилья не определяется.','With zero permanent occupancy, permanent resident growth is zero; the required housing volume cannot be calculated.'):L(`Из новых единиц жилья ${n(s.units*(1-s.occupied/100))} не имеют постоянного заселения в этом сценарии. Это могут быть сезонные, пустующие или ещё не заселённые объекты.`,`In this scenario, ${n(s.units*(1-s.occupied/100))} new units are not permanently occupied. They may be seasonal, vacant or not yet occupied.`));
 put('lp-employment',L(`При этих допущениях среди новых жителей ${n(m.workers)} занятых: ${n(m.local)} работают в городе, ${n(m.outbound)} — вне города. Это расчёт потребности, а не созданные рабочие места.`,`Under these assumptions, ${n(m.workers)} new residents are employed: ${n(m.local)} work locally and ${n(m.outbound)} outside the city. This is a demand calculation, not jobs already created.`));
 const parking=Object.entries(alternatives).map(([k,v])=>({k,v,places:Math.ceil(m.peak*v.share/100/s.carOccupancy)}));const max=Math.max(1,s.parking,...parking.map(x=>x.places));
 root.querySelector('#lp-parking-compare').innerHTML=parking.map(({k,v,places})=>`<div><div class="lp-barhead"><span>${s.alt===k?'● ':''}${L(...v.name)} · ${v.share}% ${L('на машине','by car')}</span><b>${n(places)} ${L('мест','spaces')}</b></div><div class="lp-track"><div class="lp-fill" style="width:${places/max*100}%;opacity:${s.alt===k?1:.45}"></div></div></div>`).join('');
 put('lp-cars',n(m.cars));put('lp-gap',n(Math.max(0,m.cars-s.parking)));put('lp-other',n(m.other));
 put('lp-summer-result',L(`При ${n(m.peak)} гостях одновременно и ${s.parking===0?'нулевой':n(s.parking)} парковочной ёмкости ${m.cars>s.parking?'не хватает '+n(m.cars-s.parking)+' мест':'остаётся '+n(s.parking-m.cars)+' свободных мест'}. Доступ без машины требует отдельной проверки маршрутов, вместимости и спроса.`,`With ${n(m.peak)} simultaneous visitors and ${n(s.parking)} available spaces, ${m.cars>s.parking?n(m.cars-s.parking)+' spaces are missing':n(s.parking-m.cars)+' spaces remain free'}. Non-car access needs separate route, capacity and demand checks.`));
 put('lp-time',n(m.travel));put('lp-excess',n(Math.max(0,m.travel-s.limit)));put('lp-round',n(m.travel*2));
 put('lp-time-result',m.travel>s.limit?L(`Порог ${s.limit} минут не выполнен. Нужно сократить путь на ${m.travel-s.limit} минут либо приблизить работу и услуги. Быстрый поезд сам по себе не убирает подвоз и ожидание.`,`The ${s.limit}-minute threshold is not met. Cut ${m.travel-s.limit} minutes or bring jobs and services closer. A fast train alone does not remove feeder and waiting time.`):L(`Условный маршрут укладывается в ${s.limit} минут. Это ещё не подтверждение реальной доступности: нужны расписание, тариф и проверка возвращения после смены.`,`The illustrative route meets ${s.limit} minutes. Real accessibility still requires a timetable, fare and return-after-shift check.`));
}
function validState(v){if(!v||typeof v!=='object')return;for(const[k,[min,max]]of Object.entries(specs)){if(Number.isFinite(v[k])&&v[k]>=min&&v[k]<=max)s[k]=v[k]};if(alternatives[v.alt])s.alt=v.alt;if([70,100,130].includes(v.stress))s.stress=v.stress;}
function remember(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{alternative:s.alt,housingUnits:s.units,permanentOccupancy:s.occupied,simultaneousVisitors:s.visitors},privateContent:{laish:s}}).catch(()=>{});}
validState(window.openai?.widgetState?.privateContent?.laish);
root.addEventListener('input',e=>{const k=e.target.dataset.key;if(k&&specs[k]){s[k]=Number(e.target.value);update()}});
root.addEventListener('change',e=>{if(e.target.id==='lp-stress'){s.stress=Number(e.target.value);update()}remember()});
root.addEventListener('click',e=>{const b=e.target.closest('[data-alt]');if(b){s.alt=b.dataset.alt;update();remember()}});
if(host&&window.MutationObserver)new MutationObserver(()=>{const l=host.getAttribute('data-lang')==='en'?'en':'ru';if(l!==lang){lang=l;build()}}).observe(host,{attributes:true,attributeFilter:['data-lang']});
window.addEventListener('openai:set_globals',e=>{const st=e.detail?.globals?.widgetState?.privateContent?.laish;if(st){validState(st);build()}});
build();
})();
</script>

<!-- Twin back-to-top navigation -->
<style>
#tw-back-top{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));z-index:9000;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:44px;min-height:44px;padding:10px 16px;border:1px solid #1d3c5c;border-radius:24px;background:#1d3c5c!important;color:#fff!important;box-shadow:0 3px 14px #14273826;font:600 14px/1.4 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer}
#tw-back-top[hidden]{display:none!important}
#tw-back-top:hover{background:#142738!important}
#tw-back-top:focus-visible{outline:3px solid #c9821f;outline-offset:3px}
#tw-back-top span{color:inherit!important}
@media(max-width:600px){#tw-back-top{right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));padding:10px 14px}}
</style>
<script>
(function(){
  const host=document.getElementById('dgl-tw');
  if(!host||document.getElementById('tw-back-top'))return;
  const button=document.createElement('button');
  button.id='tw-back-top';button.type='button';button.hidden=true;
  button.innerHTML='<span aria-hidden="true">↑</span><span class="tw-back-top-label"></span>';
  document.body.appendChild(button);
  function label(){const en=host.getAttribute('data-lang')==='en';button.querySelector('.tw-back-top-label').textContent=en?'Back to top':'Наверх';button.setAttribute('aria-label',en?'Back to the top of the page':'Вернуться в начало страницы')}
  function visibility(){button.hidden=window.scrollY<500}
  button.addEventListener('click',function(){
    const heading=host.querySelector('h1');
    if(heading){heading.setAttribute('tabindex','-1');heading.focus({preventScroll:true})}
    window.scrollTo({top:0,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});
  });
  window.addEventListener('scroll',visibility,{passive:true});
  new MutationObserver(label).observe(host,{attributes:true,attributeFilter:['data-lang']});
  label();visibility();
})();
</script>
